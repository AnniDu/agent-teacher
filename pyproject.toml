[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-teacher"
version = "0.1.0"
description = "CLI Learning Agent for a modular AI systems engineering curriculum."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
]

[project.scripts]
learn = "agent_teacher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

